server {
    listen 80;
    listen [::]:80;
    server_name octoshrink.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name octoshrink.liuguofeng.com;

    root /home/wwwroot/octoshrink.liuguofeng.com;
    index index.html;

    ssl_certificate /usr/local/nginx/conf/ssl/octoshrink.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/octoshrink.liuguofeng.com/octoshrink.liuguofeng.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:OctoShrinkSSL:10m;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
