name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version label used for generated artifacts (for example v2.5.7)
        required: true
        type: string
      publish:
        description: Publish the GitHub Release after validation succeeds
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

jobs:
  # ═══ macOS ARM64 / Intel 分别构建，确保内置 CLI 与主程序架构一致 ═══
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CLI tools
        run: |
          brew install pngquant oxipng mozjpeg gifsicle webp jpeg-xl libavif
          bash scripts/collect_macos_tools.sh src-tauri/resources

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build
        working-directory: src-tauri
        run: |
          cargo tauri build --target "${{ matrix.target }}" --bundles app \
            --config '{"bundle":{"resources":["resources/bin/*","resources/lib/*"]}}'
        env:
          CODE_SIGN_IDENTITY: ""

      - name: Package app for signing
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/OctoShrink.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/OctoShrink_${{ matrix.arch }}.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: src-tauri/target/${{ matrix.target }}/release/bundle/*.app.zip

  # ═══ macOS：合并 Universal 2，并自动完成 Developer ID 签名、公证与装订 ═══
  build-macos-universal:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-build
          path: artifacts/arm64

      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-build
          path: artifacts/x86_64

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_P12_BASE64:?Missing APPLE_DEVELOPER_ID_P12_BASE64 secret}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"

          KEYCHAIN_PATH="${RUNNER_TEMP}/octoshrink-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="${RUNNER_TEMP}/developer-id.p12"

          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | base64 -D > "${P12_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security import "${P12_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep 'Developer ID Application: Guofeng Liu (U8U443D7ZL)'

          cp /usr/bin/true "${RUNNER_TEMP}/developer-id-signing-test"
          codesign --force --options runtime --timestamp \
            --sign 'Developer ID Application: Guofeng Liu (U8U443D7ZL)' \
            "${RUNNER_TEMP}/developer-id-signing-test"
          codesign --verify --strict "${RUNNER_TEMP}/developer-id-signing-test"

          echo "SIGNING_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Merge Universal app
        run: |
          mkdir -p work/arm64 work/x86_64 work/universal release
          ditto -x -k artifacts/arm64/OctoShrink_arm64.app.zip work/arm64
          ditto -x -k artifacts/x86_64/OctoShrink_x86_64.app.zip work/x86_64
          bash scripts/merge_macos_universal.sh \
            work/arm64/OctoShrink.app \
            work/x86_64/OctoShrink.app \
            work/universal/OctoShrink.app

      - name: Sign, notarize, and staple macOS assets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNING_IDENTITY: 'Developer ID Application: Guofeng Liu (U8U443D7ZL)'
        run: |
          bash scripts/sign_notarize_macos_ci.sh \
            work/arm64/OctoShrink.app \
            work/x86_64/OctoShrink.app \
            work/universal/OctoShrink.app \
            release

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Sign updater archive
        run: cargo tauri signer sign "release/OctoShrink_${RELEASE_TAG}_macos_universal.app.tar.gz"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-build
          path: release/*

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  # App Store 不随 GitHub Release 分发，但每次发布必须验证独立 feature 线。
  verify-appstore:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check App Store feature line
        working-directory: src-tauri
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: cargo check --no-default-features --features appstore

  # ═══ Windows 构建 ═══
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download CLI tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path src-tauri\resources\bin | Out-Null
          Remove-Item src-tauri\resources\bin\* -Force -ErrorAction SilentlyContinue

          function Download-Tool($name, $url, $pattern) {
            try {
              $zip = "$name.zip"
              Write-Host "Downloading $name from $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $dest = "extract-$name"
              Expand-Archive $zip -DestinationPath $dest -Force
              $found = Get-ChildItem -Path $dest -Filter $pattern -Recurse | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName "src-tauri\resources\bin\$name" -Force
                Write-Host "  OK $name"
              } else {
                Write-Host "  SKIP $name - binary not found in archive"
              }
              Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "  SKIP $name - $($_.Exception.Message)"
            }
          }

          Download-Tool "pngquant.exe" "https://pngquant.org/pngquant-windows.zip" "pngquant.exe"
          Download-Tool "oxipng.exe" "https://github.com/shssoichiro/oxipng/releases/download/v9.1.5/oxipng-9.1.5-x86_64-pc-windows-msvc.zip" "oxipng.exe"
          Download-Tool "gifsicle.exe" "https://eternallybored.org/misc/gifsicle/releases/1.95/windows-x64/gifsicle-x64.zip" "gifsicle.exe"
          Download-Tool "cwebp.exe" "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0-windows-x64.zip" "cwebp.exe"
          Download-Tool "avifenc.exe" "https://github.com/AOM-AV1/libavif/releases/download/v1.1.1/libavif-win64-v1.1.1.zip" "avifenc.exe"
          Download-Tool "cjxl.exe" "https://github.com/libjxl/libjxl/releases/download/v0.10.2/jxl-x64-windows-0.10.2.zip" "cjxl.exe"
          Download-Tool "cjpeg.exe" "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.2/libjpeg-turbo-3.0.2-vc64.exe" "cjpeg.exe"

          # cjpeg from libjpeg-turbo installer might be an EXE installer, try alternative
          if (-not (Test-Path "src-tauri\resources\bin\cjpeg.exe")) {
            Download-Tool "cjpeg.exe" "https://github.com/Mozreble/mozjpeg/releases/download/v4.1.1/mozjpeg-4.1.1-win64.zip" "cjpeg.exe"
          }

          Write-Host "`nBundled tools:"
          Get-ChildItem src-tauri\resources\bin\ -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Add resources config and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.PSObject.Properties.Name -contains 'resources') {
            $config.bundle.resources = @("resources/bin/*")
          } else {
            $config.bundle | Add-Member -NotePropertyName "resources" -NoteValue @("resources/bin/*")
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content src-tauri\tauri.conf.json

          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ═══ Linux 构建 ═══
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            file

      - name: Download CLI tools
        run: |
          set +e
          rm -f src-tauri/resources/bin/*
          rm -rf src-tauri/resources/lib/

          # Install via apt
          sudo apt-get install -y pngquant gifsicle webp libavif-bin libjpeg-turbo-progs || true
          for tool in pngquant gifsicle cwebp avifenc cjpeg; do
            p=$(which $tool 2>/dev/null)
            if [ -n "$p" ] && [ -f "$p" ]; then
              cp "$p" src-tauri/resources/bin/ && echo "  OK $tool" || echo "  SKIP $tool"
            else
              echo "  SKIP $tool (not found)"
            fi
          done

          # oxipng
          wget -q "https://github.com/shssoichiro/oxipng/releases/download/v9.1.5/oxipng-9.1.5-x86_64-unknown-linux-musl.tar.gz" -O /tmp/oxipng.tar.gz && \
            tar xzf /tmp/oxipng.tar.gz -C /tmp && \
            cp /tmp/oxipng-*/oxipng src-tauri/resources/bin/ && echo "  OK oxipng" || echo "  SKIP oxipng"

          # cjxl
          wget -q "https://github.com/libjxl/libjxl/releases/download/v0.10.2/jxl-linux-x64-static-v0.10.2.tar.gz" -O /tmp/jxl.tar.gz && \
            mkdir -p /tmp/jxl-extract && \
            tar xzf /tmp/jxl.tar.gz -C /tmp/jxl-extract 2>/dev/null && \
            find /tmp/jxl-extract -name cjxl -type f -executable -exec cp {} src-tauri/resources/bin/ \; 2>/dev/null && \
            echo "  OK cjxl" || echo "  SKIP cjxl"

          echo ""
          echo "Bundled tools:"
          ls -la src-tauri/resources/bin/

      - name: Add resources config and build
        run: |
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              d = json.load(f)
          d['bundle']['resources'] = ['resources/bin/*']
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "

          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ═══ 发布 Release ═══
  release:
    needs: [build-macos, build-macos-universal, verify-appstore, build-windows, build-linux]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          find artifacts -name "*.exe" -exec cp {} release/ \;
          find artifacts -name "*.msi" -exec cp {} release/ \;
          find artifacts -name "*.deb" -exec cp {} release/ \;
          find artifacts -name "*.AppImage" -exec cp {} release/ \;
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.sig" -exec cp {} release/ \;
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="OctoShrink_${RELEASE_TAG}_macos_universal.app.tar.gz"
          SIGNATURE="$(cat "release/${ARCHIVE}.sig")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "OctoShrink ${VERSION}: 修复 macOS 15 应用图标安全区与圆角显示；支持自定义输出文件名后缀；新增 macOS 系统转换说明，并支持 JPEG/PNG/HEIF 与 Finder 尺寸档位。" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"darwin-aarch64":{signature:$signature,url:$url},"darwin-x86_64":{signature:$signature,url:$url}}}' \
            > release/latest.json
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 章小压 · OctoShrink ${{ env.RELEASE_TAG }}
          body: |
            ## 章小压 · OctoShrink

            免费开源的图片压缩神器，开箱即用。

            ### 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS Universal 2 | `_universal.dmg` | 推荐，兼容 Apple Silicon 与 Intel |
            | macOS Apple Silicon | `_arm64.dmg` | M 系列芯片专用 |
            | macOS Intel | `_x86_64.dmg` | Intel 芯片专用 |
            | Windows | `.exe` / `.msi` | 内置压缩工具，开箱即用 |
            | Linux | `.deb` / `.AppImage` | 内置压缩工具，开箱即用 |

            ### 功能
            - 支持 PNG/JPG/GIF/WebP/AVIF/JPEG XL 压缩
            - macOS 支持系统原生 JPEG/PNG/HEIF 转换与 Finder 尺寸档位
            - 3 线程并发批量处理
            - 暗黑模式（自动/亮色/暗黑）
            - macOS Direct 版支持签名校验的在线更新
            - 压缩前后实时对比
            - 一键恢复全部原图
            - 压缩失败显示错误详情
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
