[default]
description = "OctoShrink app commands — select, compress, restore, export"
permissions = [
  "allow-select-files",
  "allow-select-folder",
  "allow-select-output-dir",
  "allow-expand-image-files",
  "allow-compress-files",
  "allow-compress-smart",
  "allow-compress-single",
  "allow-cancel-file",
  "allow-clear-cancel-queue",
  "allow-save-file",
  "allow-open-in-finder",
  "allow-read-image-dataurl",
  "allow-get-app-version",
  "allow-restore-original",
  "allow-export-all",
  "allow-get-file-sizes",
  "allow-restore-all",
  "allow-set-startup-theme",
  "allow-check-for-update",
  "allow-install-update",
  "allow-open-compare-window",
  "allow-take-compare-window-payload",
  "allow-pause-compression",
  "allow-resume-compression",
  "allow-get-compression-state",
  "allow-list-history",
  "allow-clear-history",
  "allow-restore-history-entry",
  "allow-get-app-settings",
  "allow-set-original-retention-days",
]

[[permission]]
identifier = "allow-select-files"
description = "Open file picker for image selection"
commands.allow = ["select_files"]

[[permission]]
identifier = "allow-select-folder"
description = "Open folder picker"
commands.allow = ["select_folder"]

[[permission]]
identifier = "allow-select-output-dir"
description = "Pick output directory"
commands.allow = ["select_output_dir"]

[[permission]]
identifier = "allow-expand-image-files"
description = "Expand dropped paths into individual image files"
commands.allow = ["expand_image_files"]

[[permission]]
identifier = "allow-compress-files"
description = "Compress image files"
commands.allow = ["compress_files"]

[[permission]]
identifier = "allow-compress-smart"
description = "Smart compress with auto format selection"
commands.allow = ["compress_smart"]

[[permission]]
identifier = "allow-compress-single"
description = "Compress a single file with custom options"
commands.allow = ["compress_single"]

[[permission]]
identifier = "allow-cancel-file"
description = "Cancel compression for a specific file"
commands.allow = ["cancel_file"]

[[permission]]
identifier = "allow-clear-cancel-queue"
description = "Clear the cancel queue"
commands.allow = ["clear_cancel_queue"]

[[permission]]
identifier = "allow-save-file"
description = "Save a compressed file to a new location"
commands.allow = ["save_file"]

[[permission]]
identifier = "allow-open-in-finder"
description = "Reveal a file in Finder"
commands.allow = ["open_in_finder"]

[[permission]]
identifier = "allow-read-image-dataurl"
description = "Read an image file as data URL for preview"
commands.allow = ["read_image_dataurl"]

[[permission]]
identifier = "allow-get-app-version"
description = "Get app version string"
commands.allow = ["get_app_version"]

[[permission]]
identifier = "allow-restore-original"
description = "Restore original file from backup"
commands.allow = ["restore_original"]

[[permission]]
identifier = "allow-export-all"
description = "Export all compressed results"
commands.allow = ["export_all"]

[[permission]]
identifier = "allow-get-file-sizes"
description = "Get file sizes for a list of paths"
commands.allow = ["get_file_sizes"]

[[permission]]
identifier = "allow-restore-all"
description = "Restore all files from backup"
commands.allow = ["restore_all"]

[[permission]]
identifier = "allow-set-startup-theme"
description = "Persist the resolved startup theme before the next window is created"
commands.allow = ["set_startup_theme"]

[[permission]]
identifier = "allow-check-for-update"
description = "Check for a signed Direct release update"
commands.allow = ["check_for_update"]

[[permission]]
identifier = "allow-install-update"
description = "Download and install a signed Direct release update"
commands.allow = ["install_update"]

[[permission]]
identifier = "allow-cancel-update"
description = "Cancel an in-progress update download"
commands.allow = ["cancel_update"]

[[permission]]
identifier = "allow-open-compare-window"
description = "Open or focus the standalone image comparison window"
commands.allow = ["open_compare_window"]

[[permission]]
identifier = "allow-take-compare-window-payload"
description = "Take the pending comparison payload inside the compare window"
commands.allow = ["take_compare_window_payload"]

[[permission]]
identifier = "allow-pause-compression"
description = "Stop starting new compression tasks; running ones finish"
commands.allow = ["pause_compression"]

[[permission]]
identifier = "allow-resume-compression"
description = "Let the paused queue start new tasks again"
commands.allow = ["resume_compression"]

[[permission]]
identifier = "allow-get-compression-state"
description = "Read the queue state: idle, running or paused"
commands.allow = ["get_compression_state"]

[[permission]]
identifier = "allow-list-history"
description = "List persisted compression history, newest first"
commands.allow = ["list_history"]

[[permission]]
identifier = "allow-clear-history"
description = "Clear history entries and the original backups they own"
commands.allow = ["clear_history"]

[[permission]]
identifier = "allow-restore-history-entry"
description = "Restore the original behind one history entry"
commands.allow = ["restore_history_entry"]

[[permission]]
identifier = "allow-get-app-settings"
description = "Read persisted app settings, including original backup retention"
commands.allow = ["get_app_settings"]

[[permission]]
identifier = "allow-set-original-retention-days"
description = "Persist how long original backups are kept, applied at next launch"
commands.allow = ["set_original_retention_days"]

[[permission]]
identifier = "allow-get-cpu-info"
description = "Read detected CPU capability plus the configured and effective parallelism limit"
commands.allow = ["get_cpu_info"]

[[permission]]
identifier = "allow-get-cpu-resource-settings"
description = "Read the persisted CPU usage limit setting"
commands.allow = ["get_cpu_resource_settings"]

[[permission]]
identifier = "allow-set-cpu-thread-limit"
description = "Change the CPU parallelism budget; running jobs finish under the old limit"
commands.allow = ["set_cpu_thread_limit"]
