[package]
name = "octoshrink"
version = "2.5.0"
description = "OctoShrink"
authors = ["Octor Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "octoshrink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "rayon"] }
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "fs", "io-util", "time"] }
log = "0.4"
imagequant = { version = "4", optional = true }
oxipng = { version = "9", optional = true }
mozjpeg = { version = "0.10", optional = true }
webp = { version = "0.2", optional = true, default-features = false }
ravif = { version = "0.11", optional = true, default-features = false }
png = { version = "0.18", optional = true, features = ["zlib-rs"] }
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSPathUtilities", "NSString"] }

[features]
default = ["cli-backends"]
cli-backends = ["dep:tauri-plugin-updater"] # Direct 产物线：外部 CLI + GitHub 在线更新
appstore = ["inproc-backends"]     # App Store 产物线：进程内 Rust 库 + 沙盒
inproc-backends = ["dep:imagequant", "dep:oxipng", "dep:mozjpeg", "dep:webp", "dep:ravif", "dep:png"]  # 进程内 Rust 库（沙盒友好）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
